spring.application.name=rms-backend

# Server
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database Configuration: PostgreSQL
# Deploy: set DB_URL / DB_USERNAME / DB_PASSWORD env vars (e.g. Render Postgres internal URL)
spring.datasource.driver-class-name=org.postgresql.Driver
# DB_URL neu truyen truc tiep thi uu tien; nguoc lai ghep tu DB_HOST/DB_PORT/DB_NAME (Render blueprint inject tu database resource)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swp}}
# Render Postgres dat TLS proxy truoc DB -> SCRAM channel binding lech -> auth fail.
# Tat channel binding cho MOI connection (ca 2 cach goi ten de chac chan driver nhan)
spring.datasource.hikari.data-source-properties.channelBinding=disable
spring.datasource.hikari.data-source-properties.channel_binding=disable
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:phamdung.2301}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Base URLs for redirects (deploy: APP_BASE_URL = public BE URL, FRONTEND_URL = public FE URL)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Session cookie - on HTTPS cross-domain deploy set SESSION_COOKIE_SAMESITE=None and SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Demo data seeder - NEVER enable on production; enable locally with SEED_DATA=true
app.data-seeder.enabled=${SEED_DATA:false}

# Email fallback directory (only used when SMTP send fails)
app.email.fallback-dir=${EMAIL_FALLBACK_DIR:./emails}

# Google Gemini API Configuration
openai.api.key=${GEMINI_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:}}}



# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:YOUR_GMAIL_ADDRESS}
spring.mail.password=${SPRING_MAIL_PASSWORD:YOUR_GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# File Upload - Local Storage
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB
app.upload.provider=local
app.upload.local-dir=${UPLOAD_DIR:${user.dir}/uploads}
app.upload.dir=./uploads
app.upload.public-base-url=${APP_BASE_URL:http://localhost:8080}/uploads

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID:YOUR_PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY:YOUR_PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:YOUR_PAYOS_CHECKSUM_KEY}
